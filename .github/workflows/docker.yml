name: 构建并推送镜像

# 代码在 beta 分支。push 到 beta 出 latest；打 v* 标签出版本号；PR 只构建不推。
on:
  push:
    branches: [beta]
    tags: ['v*']
    paths-ignore: ['**.md', '.gitignore', 'aliases.json.tmp', 'server.out.log', 'server.err.log', 'credentials/**']
  pull_request:
    branches: [beta]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    # 测试只允许内存 mock 与 127.0.0.1；不要把 runner/宿主的凭据、订阅或代理
    # 环境带进 server-api 子进程。
    env:
      FREEBUFF_TOKEN: ''
      FREEBUFF_API_KEY: ''
      FREEBUFF_CREDENTIALS_FILE: ''
      FREEBUFF_ACCOUNT_STATE_FILE: ''
      CODEBUFF_API: ''
      SUBSCRIPTION_URL: ''
      MIHOMO_BIN: ''
      MIHOMO_DATA_DIR: ''
      MIHOMO_HEALTH_URL: ''
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      ALL_PROXY: ''
      NO_PROXY: '127.0.0.1,localhost'
      NODE_USE_ENV_PROXY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 代理出站依赖 undici；使用锁文件确保测试与镜像解析一致。
      - run: npm ci --ignore-scripts
      - run: node --check web/app.js
      - run: node --check web/login.js
      - run: node --check worker.js
      - run: node --check server.js
      - run: node --check server/account-state.mjs
      - run: node test/unit.test.mjs
      - run: node --test test/account-state.test.mjs
      - run: node --test test/account-safety-worker.test.mjs
      - run: node --test test/server-api.test.mjs
      - run: node test/proxy.test.mjs
      - run: node --test test/usage-persistence.test.mjs
      - run: node test/web-layout.test.mjs

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # 推 GHCR 靠这个，不用另配 secret
    steps:
      - uses: actions/checkout@v4

      # GHCR 的镜像名必须全小写，而 owner(MurasameCyan)带大写字母，
      # 直接拿 github.repository 拼会推不上去。
      - name: 镜像名转小写
        id: name
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # arm64 是靠 QEMU 模拟构建的。本项目不编译原生代码，
      # 唯一的跨架构动作是下对应的 mihomo 二进制，所以慢不到哪去。
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 算标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          # latest 这条钉死在 beta 上，不能用 {{is_default_branch}}:默认分支是
          # main(只有 README)，而构建来自 beta，用那个变量的话 latest 永远不会
          # 更新 —— 用户 docker compose pull 拿到的一直是旧镜像，还看不出哪错了。
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/beta' }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 面板要显示自己是哪个 commit 构建的，「检查更新」拿它和 beta 的 HEAD 比。
          # 不传的话面板显示 unknown，更新提示就永远不亮。
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 拉起容器验一遍
        # 只在 amd64 上验：runner 就是 amd64，QEMU 跑 arm64 起容器又慢又容易假失败。
        if: github.event_name != 'pull_request'
        run: |
          set -eux
          docker build --load -t verify:local --build-arg GIT_COMMIT="$GITHUB_SHA" .
          docker run -d --name verify -e ADMIN_PASSWORD=ci-test -p 8787:8787 verify:local
          # 等 healthz 就绪：容器冷启 + 首个请求可能偏慢，给足 60s。
          # 失败时打全量诊断（最后响应体 / curl -v / 容器健康态 / 日志），一眼定位。
          ok=""
          for i in $(seq 1 60); do
            body=$(curl -fsS http://127.0.0.1:8787/healthz 2>/dev/null || true)
            if printf '%s' "$body" | grep -q '"status":"ok"'; then
              ok=1; echo "healthz 就绪（第 ${i} 次）: ${body}"; break
            fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "healthz 60s 内未就绪，最后响应: [${body}]"
            echo "--- curl -v ---";      curl -v http://127.0.0.1:8787/healthz || true
            echo "--- docker ps -a ---"; docker ps -a
            echo "--- health state ---"; docker inspect -f '{{json .State.Health}}' verify || true
            echo "--- docker logs ---";  docker logs verify
            exit 1
          fi
          # 面板必须挡住匿名访问
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/_api/config)
          [ "$code" = 401 ] || { echo "面板没鉴权! 返回 $code"; docker logs verify; exit 1; }

          # 构建标识必须真的进到镜像里。这条链是 ARG → ENV → /healthz，
          # 断在哪一环面板都只显示 unknown，而那时「检查更新」永远说已是最新。
          want=$(printf '%s' "$GITHUB_SHA" | cut -c1-7)
          curl -fsS -u admin:ci-test http://127.0.0.1:8787/_api/config | grep -q "\"build\":\"$want\"" \
            || { echo "/_api/config 里的 build 不是 $want"; docker logs verify; exit 1; }

          # 两种鉴权头都得认
          K=$(curl -fsS -u admin:ci-test http://127.0.0.1:8787/_api/config | grep -o '"apiKey":"[^"]*"' | cut -d'"' -f4)
          [ -n "$K" ] || { echo "取不到 apiKey"; docker logs verify; exit 1; }
          for h in "authorization: Bearer $K" "x-api-key: $K"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "$h" http://127.0.0.1:8787/v1/models)
            [ "$code" = 200 ] || { echo "鉴权头 '${h%%:*}' 被拒(返回 $code)"; docker logs verify; exit 1; }
          done
          # 错的 key 必须挡住
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "x-api-key: nope" http://127.0.0.1:8787/v1/models)
          [ "$code" = 401 ] || { echo "错 key 竟然返回 $code"; exit 1; }

          # 无订阅时直连（不依赖 mihomo）—— 验证无订阅也能正常起
          docker logs verify
          docker rm -f verify

      # GHCR 首次推送的包一律是私有的，而且不跟随仓库可见性 ——
      # 仓库公开了包照样是私有，用户 docker compose pull 会收到
      # "unauthorized"，看起来像构建失败，其实镜像好好的。
      - name: 验镜像能匿名拉取
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          repo="${IMAGE#ghcr.io/}"
          echo "### 镜像已推送" >> "$GITHUB_STEP_SUMMARY"
          printf '```\n%s\n```\n' "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"

          resp=$(curl -sS "https://ghcr.io/token?scope=repository:${repo}:pull&service=ghcr.io")
          if printf '%s' "$resp" | grep -q '"token"'; then
            echo "匿名可拉取 —— compose 里直接引用即可,不需要 build,也不用 docker login。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo
            echo "> [!WARNING]"
            echo "> **这个包还是私有的,用户 \`docker compose pull\` 会收到 \`unauthorized\`。**"
            echo "> 镜像本身没问题(上面几步都过了),只是 GHCR 新建的包默认私有,并且不跟随仓库可见性。"
            echo ">"
            echo "> 手动改一次,以后每次推送都继承这个设置:"
            echo "> 1. 打开 https://github.com/users/${{ github.repository_owner }}/packages/container/${repo##*/}/settings"
            echo "> 2. Danger Zone → Change visibility → Public"
            echo ">"
            echo "> 顺便在同一页 Manage Actions access 里确认本仓库有 Write 权限(自动加的,一般不用动)。"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::包仍为私有,匿名拉取会失败。修复方式见本次运行的 Summary。"
