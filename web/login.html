<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · Ciallo FreeBuff Proxy</title>
<!-- 和面板同一份样式表:变量、卡片、表单、按钮全是现成的 -->
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="login">

<main class="login-card" aria-label="登录">
  <div class="login-brand">
    <span class="login-mark" aria-hidden="true">✦</span>
    <span class="login-name">Ciallo<em>FreeBuff</em></span>
  </div>

  <!-- 真表单 + autocomplete:密码管理器认这个形状 -->
  <form id="login-form" novalidate>
    <div class="input-wrap">
      <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="11" width="18" height="11" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      <input type="password" id="f-pass" name="password" autocomplete="current-password"
             placeholder="请输入管理密码" required autofocus aria-label="管理密码">
    </div>

    <p class="err" id="login-err" role="alert" hidden></p>
    <button type="submit" class="btn primary wide" id="btn-login">进入面板</button>
  </form>
</main>

<script type="module" src="/static/login.js"></script>
</body>
</html>
