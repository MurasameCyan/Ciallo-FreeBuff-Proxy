# Ciallo-FreeBuff-Proxy —— 一键部署
# 用法：
#   cp .env.example .env   # 填上 ADMIN_PASSWORD 和（可选）SUBSCRIPTION_URL
#   docker compose up -d
# 端口只绑回环，本机访问 http://127.0.0.1:8787
services:
  freebuff-proxy:
    image: ghcr.io/murasamecyan/ciallo-freebuff-proxy:latest
    container_name: ciallo-freebuff-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"

    # 想让同一台机器上别的 compose 项目（比如各种 agent 容器）直接按容器名连过来，
    # 就把下面两段和文件末尾的 networks 一起解注释。加入同一个外部网络之后，
    # 那些容器用 http://freebuff-proxy:8787/v1 就能访问，不必绕
    # host.docker.internal 或者宿主的回环端口 —— 回环映射在容器里连不上，而
    # host.docker.internal 在 Linux 上默认不存在。上面的 ports 可以一起删掉，
    # 只走内部网络的话面板和 API 都不再暴露到宿主。
    # 网络得先自己建好（compose 不会替你建 external 的）：
    #   docker network create ai-internal
    # networks:
    #   - ai-internal

    environment:
      # 面板登录密码（未设则面板免密，仅建议内网；公网部署务必设置）。
      # 变量名必须是 ADMIN_PASSWORD —— server.js 读的就是它（曾误写成 PANEL_PASS，
      # 会导致设了密码也不生效、公网面板裸奔）。值取自同目录 .env 里的 ADMIN_PASSWORD。
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # 出口代理订阅地址（可选）：机场 clash/v2ray 订阅 URL，
      # 配置后上游流量经 mihomo 节点出站；留空则直连
      SUBSCRIPTION_URL: ${SUBSCRIPTION_URL:-}
      # 面板 API Key（可选）：不设则首次启动生成并持久化
      # FREEBUFF_API_KEY: ${FREEBUFF_API_KEY:-}
      # 账号池 token（可选，多账号用逗号分隔；也可以在面板里添加）
      # FREEBUFF_TOKEN: ${FREEBUFF_TOKEN:-}
      # 上游 API 地址（一般不用改）
      # CODEBUFF_API: ${CODEBUFF_API:-}
      # 账号池只读（true=禁止面板改账号）
      # FREEBUFF_READONLY: ${FREEBUFF_READONLY:-false}
      # 封禁/凭据失效状态文件（默认 /data/credentials/account-state.json）
      # FREEBUFF_ACCOUNT_STATE_FILE: ${FREEBUFF_ACCOUNT_STATE_FILE:-}
    volumes:
      # 账号池 / API Key / 模型映射 / mihomo 缓存都落这里。
      # 绑挂到宿主 ./data，方便直接查看和管理账号文件
      # （账号池在 ./data/credentials/freebuff_credentials.json）。
      # 容器以 node(uid 1000) 运行，入口脚本启动时会把 /data 属主修正为 node，
      # 宿主目录属主对不上也不会 permission denied，无需手动 chown。
      - ./data:/data
      # 如果更想用 Docker 命名卷（数据不落宿主目录、交给 Docker 托管），
      # 改用下面这行，并解注释文件末尾的 volumes 段。
      # - freebuff-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||8787)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

# 默认用 services 里的 ./data 绑挂（数据落在 compose 文件同级的 data 目录，便于管理），
# 不需要顶层 volumes 声明。要改用 Docker 命名卷：把上面 volumes 换成
# `- freebuff-data:/data`，并解注释下面两行。
# volumes:
#   freebuff-data:

# 配合上面 services.freebuff-proxy.networks 一起解注释。external: true 是「这个网络我在
# 外面建好了，别管它的生命周期」—— compose down 不会把它删掉，别的项目还连着。
# networks:
#   ai-internal:
#     external: true
